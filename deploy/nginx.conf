# Nginx configuration for Cap PR Review
# Serves React static build and reverse-proxies API calls to uvicorn
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    sendfile    on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        # Health check endpoints — pass through to backend
        location /health { proxy_pass http://127.0.0.1:8000; }
        location /ready  { proxy_pass http://127.0.0.1:8000; }

        # SSE endpoint — long-lived connections need tuned proxy settings
        location /api/v1/sse {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # API reverse proxy
        location /api {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React SPA — serve static files, fallback to index.html
        root /app/static;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
