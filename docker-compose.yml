services:
  app:
    build: .
    container_name: cap-pr-review-app
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
